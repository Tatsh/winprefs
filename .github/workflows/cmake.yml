---
concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref }}'
  queue: 'max'
jobs:
  build:
    name: Build (MSVC)
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("$env:GITHUB_WORKSPACE" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          CMAKE_PLATFORM: ${{ matrix.arch.cmake_platform }}
          CPACK_SYSTEM: ${{ matrix.arch.cpack_system }}
        name: Configure
        run: >-
          cmake -B "$env:GITHUB_WORKSPACE/build"
          --install-prefix "$env:GITHUB_WORKSPACE/build/prefix"
          -A "$env:CMAKE_PLATFORM"
          "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE"
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          "-DCPACK_SYSTEM_NAME=$env:CPACK_SYSTEM"
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
        name: Build
        run: cmake --build "$env:GITHUB_WORKSPACE/build" --verbose --config "$env:BUILD_TYPE"
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
        name: Install
        run: cmake --install "$env:GITHUB_WORKSPACE/build" --config "$env:BUILD_TYPE" --verbose
      - env:
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        if: matrix.build-type == 'Release'
        name: Check for debug runtime linkage
        run: |
          $markers = @(
            'VCRUNTIME140D',
            'MSVCP140D',
            'VCOMP140D',
            'CONCRT140D',
            'VCCORLIB140D',
            'ucrtbased',
            'MSVCRTD',
            'MSVCPRTD'
          )
          $failed = $false
          $files = Get-ChildItem "$env:WORKSPACE/build/prefix" -File -Recurse -Include *.dll, *.exe
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            foreach ($marker in $markers) {
              if ($text.Contains($marker)) {
                Write-Host "::error::$($file.Name) references debug runtime $marker."
                $failed = $true
              }
            }
          }
          if ($failed) {
            exit 1
          }
      - name: Configure Git
        run: |
          git config --global user.email "you@example.com"
          git config --global user.name "Your Name"
      - name: Crash test
        run: '& "$env:GITHUB_WORKSPACE/build/prefix/bin/winprefs.exe" -c -d'
      - name: Show Git log of export
        run: |
          cd "${env:APPDATA}/prefs-export"
          git --no-pager log
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
        name: Package
        run: >-
          cpack -C "$env:BUILD_TYPE"
          --config "$env:GITHUB_WORKSPACE/build/CPackConfig.cmake" --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: winprefs-${{ matrix.build-type }}-${{ matrix.arch.name }}
          path: |
            ${{steps.fixed_workspace.outputs.out}}/winprefs-*.exe
            ${{steps.fixed_workspace.outputs.out}}/winprefs-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{steps.fixed_workspace.outputs.out}}/winprefs-*.exe
            ${{steps.fixed_workspace.outputs.out}}/winprefs-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' }}
        name: Upload package
        run: |
          files=()
          for path in winprefs-*.exe winprefs-*.zip; do
            if [[ -e "$path" ]]; then
              files+=("$path")
            fi
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No package files matched.'
            exit 1
          fi
          gh release create "$TAG" --draft --title "$TAG" --notes '' || true
          gh release upload "$TAG" "${files[@]}" --clobber
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        arch:
          - cmake_platform: x64
            cpack_system: win64
            name: x64
            runner: windows-latest
          - cmake_platform: ARM64
            cpack_system: winarm64
            name: arm64
            runner: windows-11-arm
        build-type: [Debug, Release]
  build-msys:
    name: Build (MSYS2)
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.sys.runner }}
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("$env:GITHUB_WORKSPACE" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - if: matrix.sys.name == 'clangarm64'
        name: Install NSIS via Chocolatey
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          install: >-
            make
          msystem: ${{matrix.sys.name}}
          pacboy: >-
            cmake:p
            ninja:p
            ${{ matrix.sys.name == 'clangarm64' && ' ' || 'nsis:p' }}
            toolchain:p
          update: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          CPACK_SYSTEM: ${{ matrix.sys.cpack_system }}
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Configure
        run: >-
          cmake -G Ninja -B "$WORKSPACE/build"
          --install-prefix "$WORKSPACE/build/prefix"
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DCPACK_SYSTEM_NAME="$CPACK_SYSTEM"
        shell: msys2 {0}
      - env:
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Build
        run: cmake --build "$WORKSPACE/build" --verbose
        shell: msys2 {0}
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Install
        run: >-
          cmake --install "$WORKSPACE/build"
          --config "$BUILD_TYPE" --verbose
        shell: msys2 {0}
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Package
        run: >-
          cpack -C "$BUILD_TYPE"
          --config "$WORKSPACE/build/CPackConfig.cmake" --verbose
        shell: msys2 {0}
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: winprefs-${{ matrix.build-type }}-${{ matrix.sys.name }}
          path: |
            ${{github.workspace}}/winprefs-*.exe
            ${{github.workspace}}/winprefs-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/winprefs-*.exe
            ${{github.workspace}}/winprefs-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.sys.release }}
        name: Upload package
        run: |
          files=()
          for path in winprefs-*.exe winprefs-*.zip; do
            if [[ -e "$path" ]]; then
              files+=("$path")
            fi
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No package files matched.'
            exit 1
          fi
          gh release create "$TAG" --draft --title "$TAG" --notes '' || true
          gh release upload "$TAG" "${files[@]}" --clobber
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - cpack_system: win64
            env: x86_64
            name: mingw64
            release: false
            runner: windows-latest
          - cpack_system: win64
            env: ucrt-x86_64
            name: ucrt64
            release: false
            runner: windows-latest
          - cpack_system: winarm64
            env: clang-aarch64
            name: clangarm64
            release: false
            runner: windows-11-arm
  build-cross:
    name: Build (MinGW cross)
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@41b837e47d7f85214629d255b9c4bc3fcbe9fd63
        with:
          platform: x64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
        name: Configure
        run: >-
          cmake -B "$GITHUB_WORKSPACE/build"
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
          -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
        name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --config "$BUILD_TYPE" --verbose
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
        name: Package
        run: >-
          cpack -G ZIP -C "$BUILD_TYPE"
          --config "$GITHUB_WORKSPACE/build/CPackConfig.cmake" --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: winprefs-${{ matrix.build-type }}-cross
          path: |
            ${{github.workspace}}/winprefs-*.exe
            ${{github.workspace}}/winprefs-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/winprefs-*.exe
            ${{github.workspace}}/winprefs-*.zip
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
name: Build
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions:
  contents: read
