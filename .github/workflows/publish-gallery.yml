---
concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}'
  queue: 'max'
jobs:
  check:
    if: "${{ github.event.workflow_run.conclusion == 'success' }}"
    name: 'Find Release'
    outputs:
      has_nuget_api_key: '${{ steps.check_secret.outputs.has_nuget_api_key }}'
      tag: '${{ steps.release.outputs.tag }}'
    runs-on: 'ubuntu-latest'
    steps:
      - env:
          GH_TOKEN: '${{ github.token }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          REPO: '${{ github.repository }}'
        id: 'release'
        name: 'Find the published release for this commit'
        run: |
          tag=''
          while IFS= read -r candidate; do
            [[ -z "$candidate" ]] && continue
            sha=$(gh api "repos/${REPO}/commits/${candidate}" \
              -H 'Accept: application/vnd.github.sha' 2>/dev/null || echo '')
            if [[ "$sha" == "$HEAD_SHA" ]]; then
              tag="$candidate"
              break
            fi
          done < <(gh release list --repo "$REPO" --exclude-drafts --limit 20 \
            --json tagName --jq '.[].tagName | select(test("^v"))')
          if [[ -z "$tag" ]]; then
            echo "No published v* release points at ${HEAD_SHA}, nothing to publish."
          else
            echo "Found published release ${tag} for ${HEAD_SHA}."
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - env:
          NUGET_API_KEY: '${{ secrets.NUGET_API_KEY }}'
        id: 'check_secret'
        if: "steps.release.outputs.tag != ''"
        name: 'Check NUGET_API_KEY is set'
        run: |
          if [[ -n "$NUGET_API_KEY" ]]; then
            echo 'has_nuget_api_key=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_nuget_api_key=false' >> "$GITHUB_OUTPUT"
            echo '::warning::NUGET_API_KEY secret is empty; the publish job will be skipped.'
          fi
  publish:
    env:
      NUGET_API_KEY: '${{ secrets.NUGET_API_KEY }}'
    if: "needs.check.outputs.tag != '' && needs.check.outputs.has_nuget_api_key == 'true'"
    name: Publish
    needs:
      - 'check'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: '${{ needs.check.outputs.tag }}'
      - name: Build module
        run: |
          Remove-Item -Force -Recurse build -ErrorAction SilentlyContinue
          New-Item -ItemType Directory build
          Set-Location build
          cmake -G "Visual Studio 17 2022" -A x64 "-DCMAKE_INSTALL_PREFIX=$PWD/prefix" -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --config Release -v
          cmake --install . --config Release -v
          Set-Location prefix
          Remove-Item -Path WinPrefs\*.deps.json -ErrorAction SilentlyContinue
          Remove-Item -Path WinPrefs\*.lib -ErrorAction SilentlyContinue
          Remove-Item -Path WinPrefs\*.pdb -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Path WinPrefs\ref -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Path WinPrefs\runtimes -ErrorAction SilentlyContinue
        shell: pwsh
      - name: Check for debug runtime linkage
        run: |
          $markers = @(
            'VCRUNTIME140D',
            'MSVCP140D',
            'VCOMP140D',
            'CONCRT140D',
            'VCCORLIB140D',
            'ucrtbased',
            'MSVCRTD',
            'MSVCPRTD'
          )
          $failed = $false
          $files = Get-ChildItem "build/prefix/WinPrefs" -File -Recurse -Include *.dll, *.exe
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            foreach ($marker in $markers) {
              if ($text.Contains($marker)) {
                Write-Host "::error::$($file.Name) references debug runtime $marker."
                $failed = $true
              }
            }
          }
          if ($failed) {
            exit 1
          }
        shell: pwsh
      - name: Publish to PowerShell Gallery
        run: Publish-Module -Name .\WinPrefs -NuGetApiKey $env:NUGET_API_KEY
        shell: pwsh
name: 'Publish to PowerShell Gallery'
'on':
  workflow_run:
    workflows:
      - 'Release'
    types:
      - 'completed'
permissions:
  contents: 'read'
