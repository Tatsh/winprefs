---
jobs:
  managed:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("${{github.workspace}}" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: humbletim/vsdevenv-shell@503210b7b39a7405e534ea93c36a733b93f01087
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage --version 18.10.0
        shell: vsdevenv x64 powershell {0}
      - env:
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Configure
        run: >-
          cmake -B "$env:WORKSPACE/build"
          --install-prefix "$env:WORKSPACE/build/prefix"
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}
          -DBUILD_CSharp_TESTS=ON
        shell: vsdevenv x64 powershell {0}
      - env:
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Build
        run: >-
          msbuild "$env:WORKSPACE/build/ALL_BUILD.vcxproj" /restore
          /p:Configuration=${{matrix.build-type}} /p:platform=x64 /v:n
        shell: vsdevenv x64 powershell {0}
      - env:
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Run tests
        run: >-
          dotnet-coverage collect --nologo -o cobertura.xml --output-format cobertura
          --include-files "src/*.cs" ctest --test-dir
          "$env:WORKSPACE/build/tests" --output-on-failure
          -C ${{matrix.build-type}}
        shell: vsdevenv x64 powershell {0}
      - if: matrix.build-type == 'Debug'
        name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
  native:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("${{github.workspace}}" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          install: >-
            make
          msystem: MINGW64
          pacboy: >-
            cmake:p
            cmocka:p
            graphviz:p
            lcov:p
            ninja:p
            toolchain:p
          update: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Configure
        run: >-
          cmake -G Ninja -B "$WORKSPACE/build"
          --install-prefix "$WORKSPACE/build/prefix"
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}
          -DBUILD_TESTS=ON
          -DENABLE_COVERAGE=ON
        shell: msys2 {0}
      - env:
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Build
        run: >-
          cmake --build "$WORKSPACE/build"
          --verbose --config ${{matrix.build-type}}
        shell: msys2 {0}
      - env:
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Run tests
        run: >-
          ctest --test-dir "$WORKSPACE/build/native/tests"
          --verbose -C ${{matrix.build-type}}
        shell: msys2 {0}
      - env:
          WORKSPACE: ${{ steps.fixed_workspace.outputs.out }}
        name: Generate coverage information
        run: >-
          lcov --capture --directory "$WORKSPACE/build"
          --exclude 'D:/*'
          --output-file coverage.lcov
        shell: msys2 {0}
      - if: matrix.build-type == 'Debug'
        name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
  asan-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        run: sudo apt-get update -y && sudo apt-get install -y libcmocka-dev
      - name: Configure
        run: >-
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}
          -DBUILD_TESTS=ON
          -DENABLE_ASAN=ON
          -DENABLE_UBSAN=ON
      - name: Build
        run: cmake --build ${{github.workspace}}/build --verbose
      - name: Run tests
        run: ctest --test-dir ${{github.workspace}}/build/native/tests --verbose
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, RelWithDebInfo]
name: Tests
'on':
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
permissions:
  contents: 'read'
